<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1714"><link rel="manifest" href="manifest.json"><title>GymSaathi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1714;color:#f1f7f3;font:15px system-ui;padding:16px;max-width:760px;margin:auto}h1{margin:4px 0}small,.hint{color:#a7b9af}.panel{background:#13231e;border:1px solid #294239;border-radius:16px;padding:15px;margin:14px 0}label{display:block;color:#a7b9af;font-size:12px;margin:10px 0 5px}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #345145;background:#0d1a15;color:white;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{padding:11px 14px;border-radius:10px;border:1px solid #426451;background:#20392d;color:white;font-weight:650;margin:5px 3px 5px 0}.primary{background:#7de0a4;color:#092015;border:0;width:100%;padding:14px}.tabs{display:flex;gap:8px}.tabs button{flex:1}.active{background:#376b4b}.exercise,.record{background:#0e1b16;border:1px solid #294239;border-radius:12px;padding:12px;margin:10px 0}.set{display:grid;grid-template-columns:30px 1fr 1fr 34px;gap:6px;align-items:center;margin:7px 0}.set input{padding:9px;text-align:center}.muted{color:#a7b9af;font-size:12px}.hidden{display:none!important}.danger{background:#482525;border-color:#744}
</style></head><body>
<h1>🏋️ GymSaathi</h1><small>Your personal workout journal · Data stays on this phone</small>
<div class="panel"><div class="tabs"><button id="logTab" class="active">Log workout</button><button id="histTab">History & progress</button></div></div>
<section id="log">
<div class="panel"><h3>Today's workout</h3><div class="grid"><div><label>Date</label><input id="date" type="date"></div><div><label>Muscle group</label><select id="muscle"><option>Biceps</option><option>Triceps</option><option>Chest</option><option>Back</option><option>Shoulders</option><option>Legs</option><option>Abs</option><option>Full body</option><option>Cardio</option><option>Other</option></select></div></div>
<label>Workout title</label><input id="title" placeholder="e.g. Biceps day"><div id="exercises"></div><button id="addEx">＋ Add exercise</button><label>Notes</label><textarea id="notes" rows="2" placeholder="Optional notes"></textarea><button class="primary" id="save">Save workout</button><p class="muted">Example: Dumbbell Curl · 7.5 kg × 12 reps. Add each set separately.</p></div>
</section>
<section id="history" class="hidden"><div class="panel"><h3>Saved workouts</h3><div id="records"></div></div><div class="panel"><h3>Exercise progress</h3><label>Exercise name</label><input id="progressName" placeholder="e.g. Dumbbell Curl"><div id="progress" class="muted"></div><button id="backup">Download backup</button><label>Restore backup</label><input id="restore" type="file" accept="application/json"></div></section>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),KEY='gymsaathi_phone_workouts_v1';let data=[],count=0;
const d=new Date();$('date').value=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
function load(){try{data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data))data=[]}catch(e){data=[]}}
function saveData(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('Browser storage blocked hai. App ko Chrome mein HTTPS website se open/install karein.');return false}}
function addSet(host){let n=host.querySelectorAll('.set').length+1;let r=document.createElement('div');r.className='set';r.innerHTML='<span class="muted">'+n+'</span><input type="number" min="0" step=".25" placeholder="Weight kg" class="kg"><input type="number" min="0" placeholder="Reps" class="reps"><button type="button" class="danger">×</button>';r.querySelector('button').onclick=()=>{r.remove();[...host.querySelectorAll('.set')].forEach((x,i)=>x.firstElementChild.textContent=i+1)};host.append(r)}
function addExercise(){count++;let e=document.createElement('div');e.className='exercise';e.innerHTML='<b>Exercise '+count+'</b><button type="button" class="danger" style="float:right">Remove</button><label>Exercise name</label><input class="ename" placeholder="e.g. Hammer Curl"><div class="sets"></div><button type="button" class="addSet">＋ Add set</button>';e.querySelector('.danger').onclick=()=>e.remove();e.querySelector('.addSet').onclick=()=>addSet(e.querySelector('.sets'));addSet(e.querySelector('.sets'));$('exercises').append(e)}
function saveWorkout(){let ex=[...$('exercises').querySelectorAll('.exercise')].map(e=>({name:e.querySelector('.ename').value.trim(),sets:[...e.querySelectorAll('.set')].map(s=>({kg:s.querySelector('.kg').value,reps:s.querySelector('.reps').value})).filter(s=>s.kg!==''||s.reps!=='')})).filter(e=>e.name);if(!ex.length){alert('Exercise ka naam likhiye, jaise Dumbbell Curl.');return}if(ex.some(e=>!e.sets.length)){alert('Kam se kam ek set mein weight ya reps bhariye.');return}data.unshift({id:Date.now(),date:$('date').value,muscle:$('muscle').value,title:$('title').value,notes:$('notes').value,ex});if(saveData()){alert('Workout save ho gaya!');$('exercises').innerHTML='';count=0;addExercise();$('title').value='';$('notes').value='';render()}}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){let h=$('records');h.innerHTML='';if(!data.length){h.textContent='Abhi koi workout save nahi hai.';return}data.forEach(w=>{let c=document.createElement('div');c.className='record';c.innerHTML='<b>'+esc(w.title||w.muscle+' workout')+'</b><div class="muted">'+esc(w.date)+' · '+esc(w.muscle)+'</div><ul>'+w.ex.map(e=>'<li><b>'+esc(e.name)+'</b>: '+e.sets.map(s=>esc(s.kg||'—')+' kg × '+esc(s.reps||'—')+' reps').join(', ')+'</li>').join('')+'</ul><button class="danger">Delete</button>';c.querySelector('button').onclick=()=>{if(confirm('Delete workout?')){data=data.filter(x=>x.id!==w.id);saveData();render()}};h.append(c)})}
function progress(){let q=$('progressName').value.trim().toLowerCase();let rows=[];data.forEach(w=>w.ex.forEach(e=>{if(e.name.toLowerCase()===q)e.sets.forEach(s=>{if(s.kg!=='')rows.push({date:w.date,kg:Number(s.kg),reps:s.reps})})}));rows.sort((a,b)=>a.date.localeCompare(b.date));$('progress').innerHTML=rows.length?'Heaviest: <b>'+Math.max(...rows.map(x=>x.kg))+' kg</b><br>'+rows.slice().reverse().map(x=>esc(x.date)+' — '+x.kg+' kg × '+esc(x.reps)+' reps').join('<br>'):'Exercise name type karke saved progress dekhein.'}
$('addEx').onclick=addExercise;$('save').onclick=saveWorkout;$('logTab').onclick=()=>{$('log').classList.remove('hidden');$('history').classList.add('hidden');$('logTab').classList.add('active');$('histTab').classList.remove('active')};$('histTab').onclick=()=>{$('history').classList.remove('hidden');$('log').classList.add('hidden');$('histTab').classList.add('active');$('logTab').classList.remove('active');render();progress()};$('progressName').oninput=progress;
$('backup').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({workouts:data})],{type:'application/json'}));a.href=u;a.download='gymsaathi-backup.json';a.click();URL.revokeObjectURL(u)};
$('restore').onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text()),arr=Array.isArray(j)?j:j.workouts;if(!Array.isArray(arr))throw 0;if(confirm('Backup records add karein?')){data=[...arr,...data];saveData();render();alert('Backup restored')}}catch(_){alert('Backup file valid nahi hai')}};
load();addExercise();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
